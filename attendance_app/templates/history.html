{% extends 'base.html' %}
{% block content %}
  <h2 class="mb-3">Attendance History</h2>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Date</th>
        <th>Present</th>
        <th>Total</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for r in rows %}
        <tr>
          <td>{{ r.attendance_date }}</td>
          <td>{{ r.present_count }}</td>
          <td>{{ r.total_count }}</td>
          <td>
            <a class="btn btn-sm btn-outline-primary" href="{{ url_for('attendance_for_date', date_str=r.attendance_date) }}">Details</a>
            <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('index', date=r.attendance_date) }}">Edit</a>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
